<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>长征 · 十二问</title>
<style>
:root{
  --paper:#f2e8d5; --card:#fbf5e8; --ink:#241f1a; --ink2:#4c4236;
  --red:#b03a2e; --red-d:#8a2b21; --ochre:#c98a2e; --teal:#2f5d62;
  --blue:#39566f; --grey:#8b8378; --line:#3a322a; --soft:#e6d9bd;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-size:16px; line-height:1.78;
  font-family:"Songti SC","STSong","SimSun","宋体",serif;
  -webkit-text-size-adjust:100%;
  background-image:
    radial-gradient(circle at 12% 16%, rgba(176,58,46,.05), transparent 42%),
    radial-gradient(circle at 88% 8%, rgba(47,93,98,.05), transparent 40%),
    radial-gradient(circle at 72% 94%, rgba(201,138,46,.07), transparent 46%);
  background-attachment:fixed;
}
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.05;
  mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2'/></filter><rect width='150' height='150' filter='url(%23n)'/></svg>");
}
.wrap{position:relative; z-index:1; max-width:720px; margin:0 auto; padding:24px 20px 72px}
.hand{font-family:"Kaiti SC","STKaiti","KaiTi","楷体","Songti SC",serif}

/* 报头 */
.mast{display:flex; align-items:center; gap:16px; padding:6px 0 20px; border-bottom:1px solid rgba(58,50,42,.25)}
.seal{
  width:56px; height:56px; flex:0 0 56px; background:var(--red); color:#f7efdd;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-size:19px; line-height:1.15; letter-spacing:1px; transform:rotate(-2.2deg);
  font-family:"Kaiti SC","STKaiti","KaiTi","楷体",serif;
  box-shadow:2px 2px 0 rgba(138,43,33,.35);
}
.mast h1{font-size:27px; margin:0; letter-spacing:2px; font-weight:400}
.mast .sub{margin:2px 0 0; font-size:12.5px; color:var(--ink2); letter-spacing:.6px}

/* 屏幕 */
.screen{display:none; padding-top:26px}
.screen.on{display:block; animation:fade .28s ease}
@keyframes fade{from{opacity:0; transform:translateY(4px)}to{opacity:1; transform:none}}

.card{
  position:relative; overflow:hidden;
  background:var(--card); border:1px solid var(--line); padding:22px 22px 24px;
  box-shadow:5px 5px 0 rgba(58,50,42,.13);
}
.card + .card{margin-top:18px}
p{margin:.7em 0}
.lead{font-size:20px; line-height:1.7; color:var(--ink)}
.rules{margin:16px 0 22px; padding-left:0; list-style:none}
.rules li{position:relative; padding-left:22px; margin:9px 0; font-size:14.6px; color:var(--ink2)}
.rules li::before{content:"·"; position:absolute; left:6px; top:-2px; color:var(--red); font-size:22px}
.rules b{color:var(--ink); font-weight:400; border-bottom:1px solid var(--red)}

.btn{
  font-family:"Kaiti SC","STKaiti","KaiTi","楷体",serif;
  font-size:17px; letter-spacing:3px; padding:9px 26px; cursor:pointer;
  background:var(--ink); color:var(--paper); border:1.5px solid var(--ink);
  transition:background .15s, color .15s, transform .1s;
}
.btn:hover{background:var(--red); border-color:var(--red)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent; color:var(--ink)}
.btn.ghost:hover{background:var(--ink); color:var(--paper)}
.btn[disabled]{opacity:.45; cursor:default}

/* 进度 */
.bar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px}
.dots{display:flex; gap:4px; flex-wrap:wrap}
.dots i{width:15px; height:5px; border:0; background:#d9cbb2; display:block}
.dots i.done{background:var(--ink)}
.dots i.now{background:var(--red)}
.dots i.right{background:var(--red)}
.cnt{font-size:13.5px; color:var(--ink2)}

/* 题目 */
.qno{font-size:12.5px; color:var(--red); letter-spacing:2px; margin-bottom:2px}
.q{font-size:21px; line-height:1.65; margin:0 0 18px; font-weight:400; padding-bottom:15px; border-bottom:1px dashed rgba(58,50,42,.32)}

.opts{display:flex; flex-direction:column; gap:9px}
.opt{
  display:flex; align-items:flex-start; gap:11px; width:100%; text-align:left; cursor:pointer;
  background:transparent; border:1px solid rgba(58,50,42,.5); padding:10px 13px;
  font-family:inherit; font-size:15.6px; line-height:1.6; color:var(--ink);
  transition:background .12s, border-color .12s;
}
.opt:hover:not(.locked){background:#f1e5cd; border-color:var(--ink); box-shadow:3px 3px 0 rgba(58,50,42,.14); transform:translateX(1px)}
.opt .k{
  flex:0 0 22px; height:22px; line-height:21px; text-align:center; font-size:13px;
  border:1px solid var(--line); font-family:"Kaiti SC","KaiTi",serif; margin-top:1px;
}
.opt.right{background:#e2ead9; border-color:#5c7a4a}
.opt.right .k{background:#5c7a4a; color:#fff; border-color:#5c7a4a}
.opt.wrong{background:#f2dcd6; border-color:var(--red)}
.opt.wrong .k{background:var(--red); color:#fff; border-color:var(--red)}
.opt.locked{cursor:default}

.fb{margin-top:16px; border-left:3px solid var(--red); background:#f6ead3; padding:11px 14px; font-size:14.4px; line-height:1.75}
@keyframes rise{from{opacity:0; transform:translateY(5px)}to{opacity:1; transform:none}}
.fb{animation:rise .2s ease}
.fb .tag{font-family:"Kaiti SC","KaiTi",serif; color:var(--red); letter-spacing:1px; margin-right:6px}
.fb b{font-weight:400; color:var(--red-d)}
.foot{margin-top:18px; display:flex; justify-content:flex-end}

/* 成绩 */
.score{font-size:58px; line-height:1; letter-spacing:2px; color:var(--red)}
.score small{font-size:20px; color:var(--ink2); letter-spacing:0}
.rank{font-size:23px; margin:6px 0 4px; letter-spacing:2px}
.rankdesc{font-size:14.6px; color:var(--ink2); margin-top:0}
.review{margin-top:20px; border-top:1px dashed rgba(58,50,42,.4); padding-top:14px}
.review h3{font-size:15px; font-weight:400; letter-spacing:1px; margin:0 0 10px; color:var(--red)}
.review .item{margin:0 0 14px; font-size:14.4px; line-height:1.7}
.review .item .qq{color:var(--ink)}
.review .item .aa{color:var(--ink2); font-size:13.4px}

/* 问卷 */
fieldset{border:0; margin:0 0 22px; padding:0}
legend{font-size:16px; letter-spacing:1px; margin-bottom:8px; padding:0; color:var(--ink)}
.optline{display:flex; align-items:flex-start; gap:9px; padding:5px 0; font-size:15.2px; cursor:pointer}
.optline input{margin-top:6px; accent-color:var(--red); width:15px; height:15px; flex:0 0 auto}
textarea{
  width:100%; min-height:96px; padding:10px 12px; font-family:inherit; font-size:15px; line-height:1.7;
  color:var(--ink); background:#fdf8ec; border:1px solid var(--line); resize:vertical;
}
textarea:focus, input[type=text]:focus{outline:2px solid rgba(176,58,46,.3); outline-offset:1px}
input[type=text]{
  width:100%; padding:9px 12px; font-family:inherit; font-size:15px; color:var(--ink);
  background:#fdf8ec; border:1px solid var(--line);
}
.hint{font-size:12.8px; color:var(--grey); margin:6px 0 0}

/* 完成页 */
.tnum{font-size:15px; color:var(--ink2)}
.bars{margin:16px 0 22px}
.bars .row{margin:10px 0; font-size:13.8px}
.bars .row .lb{display:flex; justify-content:space-between; color:var(--ink2)}
.bars .track{height:9px; background:#e7dbc3; border:1px solid rgba(58,50,42,.35); margin-top:3px}
.bars .fill{height:100%; background:var(--red); opacity:.78}
.acts{display:flex; flex-wrap:wrap; gap:10px; margin-top:8px}

footer{margin-top:26px; font-size:12.4px; color:var(--grey); text-align:center; letter-spacing:.4px}
footer span{color:var(--red)}

/* 题号水印 */
#ghost{
  position:absolute; right:14px; top:2px; font-size:78px; line-height:1; letter-spacing:2px;
  color:rgba(176,58,46,.075); font-family:"Kaiti SC","KaiTi",serif; pointer-events:none; user-select:none;
}
/* 小屏 */
@media (max-width:520px){
  .wrap{padding:16px 14px 56px}
  .card{padding:18px 16px 20px}
  .mast{gap:12px}
  .seal{width:48px; height:48px; flex-basis:48px; font-size:16px}
  .mast h1{font-size:22px}
  .mast .sub{font-size:11.5px; letter-spacing:0}
  .lead{font-size:18px}
  .q{font-size:19px}
  .opt{font-size:15px; padding:9px 11px}
  #ghost{font-size:58px; right:10px}
  .btn{width:100%}
  .foot{justify-content:stretch}
  .score{font-size:48px}
  .review .item{font-size:13.6px}
}

/* ================= 主题增强：字体 · 动效 · 细节 ================= */
:root{
  --f-disp:"STLiti","隶书","STXingkai","华文行楷","KaiTi","楷体",serif;
  --f-body:"Songti SC","STSong","SimSun","宋体",serif;
  --f-num:"Georgia","Times New Roman",serif;
}
body{font-family:var(--f-body)}

/* 背景缓慢流动的暖色光斑 */
body::after{
  content:""; position:fixed; inset:-20%; z-index:0; pointer-events:none;
  background:
    radial-gradient(38% 30% at 18% 18%, rgba(176,58,46,.075), transparent 62%),
    radial-gradient(34% 26% at 84% 26%, rgba(47,93,98,.06), transparent 62%),
    radial-gradient(44% 34% at 62% 88%, rgba(201,138,46,.075), transparent 62%);
  animation:drift 28s ease-in-out infinite alternate;
}
@keyframes drift{
  from{transform:translate3d(-2.5%,-1.5%,0) scale(1)}
  to{transform:translate3d(2.5%,2%,0) scale(1.08)}
}

/* 报头：隶书标题 + 印章落下 + 红线生长 */
.mast h1{font-family:var(--f-disp); font-size:31px; letter-spacing:6px; font-weight:400; position:relative}
.mast h1::after{
  content:""; position:absolute; left:1px; right:0; bottom:-7px; height:1px;
  background:linear-gradient(90deg, var(--red), rgba(176,58,46,0));
  transform:scaleX(0); transform-origin:left; animation:grow 1.1s .15s cubic-bezier(.2,.8,.2,1) forwards;
}
@keyframes grow{to{transform:scaleX(1)}}
.seal{animation:sealIn .75s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes sealIn{
  0%{transform:rotate(-16deg) scale(2.1); opacity:0}
  70%{transform:rotate(-1deg) scale(.97); opacity:1}
  100%{transform:rotate(-2.2deg) scale(1)}
}

/* 卡片顶部一条断续的朱线，像装订线 */
.card{position:relative}
.card::before{
  content:""; position:absolute; left:0; right:0; top:0; height:3px;
  background:repeating-linear-gradient(90deg, var(--red) 0 7px, transparent 7px 15px);
  opacity:.45;
}

/* 首页标题逐字浮现 */
.lead{font-family:var(--f-disp); font-size:24px; letter-spacing:2px}
.lead .ch{display:inline-block; opacity:0; transform:translateY(7px); animation:chIn .55s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes chIn{to{opacity:1; transform:none}}

/* 进度：一条行军刻度 */
.dots i{width:16px; height:3px; background:#d9cbb2; transition:transform .25s ease, background .25s ease}
.dots i.done{background:var(--ink)}
.dots i.now{background:var(--red); transform:scaleY(2.4); transform-origin:center}

/* 选项：左侧朱条从上方落下 */
.opt{position:relative; overflow:hidden; transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease}
.opt::before{
  content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
  background:var(--red); transform:scaleY(0); transform-origin:top; transition:transform .2s ease;
}
.opt:hover:not(.locked)::before{transform:scaleY(1)}
.opt:hover:not(.locked){transform:translateX(2px); box-shadow:3px 3px 0 rgba(58,50,42,.12)}
.opt.right{animation:stampIn .38s cubic-bezier(.2,.9,.3,1.3)}
.opt.wrong{animation:shake .32s ease}
@keyframes stampIn{0%{transform:scale(1.035)}55%{transform:scale(.99)}100%{transform:scale(1)}}
@keyframes shake{12%,88%{transform:translateX(-2px)}32%,68%{transform:translateX(3px)}52%{transform:translateX(-3px)}}

/* 题号水印轻轻浮动 */
#ghost{animation:floaty 7s ease-in-out infinite alternate}
@keyframes floaty{from{transform:translateY(0)}to{transform:translateY(5px)}}

/* 成绩页：数字与称号 */
.score{font-family:var(--f-num); font-size:62px}
#result.on .score{animation:scoreIn .7s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes scoreIn{0%{opacity:0; transform:scale(.82)}60%{opacity:1; transform:scale(1.04)}100%{transform:scale(1)}}
.rank{font-family:var(--f-disp); font-size:30px; letter-spacing:9px; animation:inkIn .8s .1s ease both}
@keyframes inkIn{
  from{opacity:0; filter:blur(9px); letter-spacing:20px}
  to{opacity:1; filter:blur(0); letter-spacing:9px}
}
.review h3{font-family:var(--f-disp); letter-spacing:3px; font-size:16px}

/* 按钮：悬停时右下的硬阴影长出来 */
.btn{transition:background .2s ease, color .2s ease, box-shadow .2s ease, transform .12s ease}
.btn:hover{box-shadow:4px 4px 0 rgba(176,58,46,.22)}
.btn:active{transform:translateY(1px)}

/* 页脚的电波 */
.morse{display:flex; gap:7px; justify-content:center; align-items:center; margin:22px 0 0; opacity:.42}
.morse i{display:block; width:6px; height:6px; border-radius:50%; background:var(--red); animation:blink 2.6s infinite}
.morse i.bar{width:17px; border-radius:2px}
@keyframes blink{0%,72%,100%{opacity:.22}34%{opacity:1}}

@media (prefers-reduced-motion:reduce){
  *{animation:none !important; transition:none !important}
  .lead .ch{opacity:1; transform:none}
}

/* 右侧竖排诗句（窄屏隐藏） */
.poem{
  position:fixed; right:14px; top:104px; z-index:1; pointer-events:none; user-select:none;
  writing-mode:vertical-rl; text-orientation:upright;
  font-family:var(--f-disp); font-size:15px; line-height:2.7; letter-spacing:7px;
  color:rgba(176,58,46,.28);
}
.poem span{display:block}
.poem span + span{margin-right:16px; color:rgba(47,93,98,.24)}
@media (max-width:920px){.poem{display:none}}

/* 页脚边款 */
.colophon{
  text-align:center; margin:26px 0 0; font-size:11.5px; letter-spacing:6px;
  color:rgba(58,50,42,.34); font-family:var(--f-body);
}

#home{min-height:0}
#home .card{width:100%}
.poem{top:50%; transform:translateY(-50%)}
@media (max-height:700px){#home{min-height:0}}

#home{min-height:0}
#home .card{margin-top:34px}

/* 时间线 */
.timeline{position:relative; margin:38px 4px 0}
.timeline::before{
  content:""; position:absolute; left:5%; right:5%; top:3px; height:1px;
  background:linear-gradient(90deg, rgba(58,50,42,0), rgba(58,50,42,.38), rgba(58,50,42,.38), rgba(58,50,42,0));
}
.timeline ul{display:flex; justify-content:space-between; margin:0; padding:20px 0 0; list-style:none}
.timeline li{flex:1; text-align:center; position:relative; font-size:11.5px; letter-spacing:1px; color:rgba(58,50,42,.55)}
.timeline li b{display:block; font-family:var(--f-num); font-weight:400; font-size:13px; color:rgba(58,50,42,.72); letter-spacing:.5px}
.timeline li::before{
  content:""; position:absolute; left:50%; top:-17px; width:6px; height:6px; border-radius:50%;
  background:var(--red); transform:translateX(-50%); box-shadow:0 0 0 3px rgba(176,58,46,.10);
  animation:pulse 3.2s ease-in-out infinite;
}
.timeline li:nth-child(2)::before{animation-delay:.4s}
.timeline li:nth-child(3)::before{animation-delay:.8s}
.timeline li:nth-child(4)::before{animation-delay:1.2s}
.timeline li:nth-child(5)::before{animation-delay:1.6s}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(176,58,46,.08)}50%{box-shadow:0 0 0 6px rgba(176,58,46,.04)}}
@media (max-width:560px){
  .timeline li{font-size:10px}
  .timeline li b{font-size:11px}
  .timeline{margin-top:28px}
}
.colophon{display:none}

/* ============ 背景装饰：纸的四周压暗 + 远山 + 雾 ============ */
html{background:var(--paper)}
.edge{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  box-shadow:inset 0 0 140px rgba(120,92,54,.10), inset 0 0 40px rgba(120,92,54,.05);
}
.scenery{
  position:fixed; left:0; right:0; bottom:0; height:42vh; min-height:220px;
  z-index:0; pointer-events:none; overflow:hidden;
}
.scenery i{position:absolute; left:-6%; bottom:0; width:112%; height:100%; display:block}
.scenery .far{
  background:linear-gradient(180deg, rgba(47,93,98,.16), rgba(47,93,98,.07));
  filter:blur(2px); clip-path:polygon(0 100%,0 63%,4% 55%,9% 60%,14% 47%,19% 56%,24% 50%,30% 58%,36% 44%,42% 55%,48% 49%,54% 57%,60% 46%,66% 55%,72% 50%,78% 58%,84% 47%,90% 56%,96% 51%,100% 57%,100% 100%);
  animation:sway 34s ease-in-out infinite alternate;
}
.scenery .near{
  background:linear-gradient(180deg, rgba(58,50,42,.13), rgba(58,50,42,.04));
  filter:blur(1px); clip-path:polygon(0 100%,0 80%,5% 73%,11% 78%,17% 68%,23% 76%,29% 70%,35% 79%,41% 67%,47% 75%,53% 70%,59% 78%,65% 69%,71% 77%,77% 71%,83% 78%,89% 69%,95% 76%,100% 72%,100% 100%);
  animation:sway 26s ease-in-out infinite alternate-reverse;
}
.scenery .mist{
  position:absolute; left:0; right:0; bottom:0; height:46%;
  background:linear-gradient(180deg, rgba(242,232,213,0), rgba(242,232,213,.85));
}

.scenery .sun{
  position:absolute; right:16%; bottom:22%; width:150px; height:150px; border-radius:50%;
  background:radial-gradient(circle, rgba(201,138,46,.20), rgba(201,138,46,.06) 45%, rgba(201,138,46,0) 70%);
  filter:blur(2px);
}
@keyframes sway{
  from{transform:translate3d(-1.6%,0,0)}
  to{transform:translate3d(1.6%,0,0)}
}
@media (max-width:560px){
  .scenery{height:32vh}
}

.morse{position:fixed; left:0; right:0; bottom:12px; margin:0; z-index:2}
</style>
</head>
<body>

<div class="wrap">
  <header class="mast">
    <div class="seal">长<br>征</div>
    <div>
      <h1 class="hand">长征 · 十二问</h1>
      <p class="sub">1934—1936　中国工农红军长征胜利九十周年</p>
    </div>
  </header>

  <!-- 首页 -->
  <section id="home" class="screen on">
    <div class="card">
      <p class="lead hand">十二道题，走一遍二万五千里。</p>
      <button class="btn" id="btnStart">开 始 答 题</button>
    </div>
    <footer>思政实践 · 电子程序类　｜　数据保存在本机浏览器</footer>
  </section>

  <!-- 答题 -->
  <section id="quiz" class="screen">
    <div class="bar">
      <div class="dots" id="dots"></div>
      <div class="cnt hand" id="cnt"></div>
    </div>
    <div class="card">
      <span class="ghost" id="ghost" aria-hidden="true"></span>
      <div class="qno hand" id="qno"></div>
      <h2 class="q hand" id="qtext"></h2>
      <div class="opts" id="opts"></div>
      <div class="fb" id="fb" hidden></div>
      <div class="foot"><button class="btn" id="btnNext" hidden>下 一 题</button></div>
    </div>
  </section>

  <!-- 成绩 -->
  <section id="result" class="screen">
    <div class="card">
      <div class="score hand" id="score"></div>
      <div class="rank hand" id="rank"></div>
      <p class="rankdesc" id="rankdesc"></p>
      <div class="acts">
        <button class="btn" id="btnSurvey">去 填 问 卷</button>
      </div>
    </div>
  </section>

  <!-- 问卷 -->
  <section id="survey" class="screen">
    <div class="card">
      <p class="lead hand">最后几问，说说你的想法。</p>
      <form id="sf" novalidate>
        <fieldset>
          <legend class="hand">1. 你对长征的了解程度</legend>
          <label class="optline"><input type="radio" name="s1" value="很了解，读过相关史料"><span>很了解，读过一些史料</span></label>
          <label class="optline"><input type="radio" name="s1" value="知道主要事件"><span>知道主要事件和时间线</span></label>
          <label class="optline"><input type="radio" name="s1" value="基本停留在课本"><span>基本停留在课本和影视里</span></label>
          <label class="optline"><input type="radio" name="s1" value="只知道零碎片段"><span>只记得零碎片段</span></label>
        </fieldset>

        <fieldset>
          <legend class="hand">2. 长征里最打动你的是（可多选）</legend>
          <label class="optline"><input type="checkbox" name="s2" value="理想信念"><span>明知走不到也要走的信念</span></label>
          <label class="optline"><input type="checkbox" name="s2" value="军民关系"><span>半条被子那样的军民关系</span></label>
          <label class="optline"><input type="checkbox" name="s2" value="不怕牺牲"><span>湘江边、泸定桥上的牺牲</span></label>
          <label class="optline"><input type="checkbox" name="s2" value="实事求是"><span>遵义会议那种敢于纠错的清醒</span></label>
          <label class="optline"><input type="checkbox" name="s2" value="艰苦奋斗"><span>雪山草地里熬出来的韧劲</span></label>
        </fieldset>

        <fieldset>
          <legend class="hand">3. 长征精神和你现在的生活、专业有关系吗</legend>
          <label class="optline"><input type="radio" name="s3" value="关系很大"><span>关系很大，能说清在哪</span></label>
          <label class="optline"><input type="radio" name="s3" value="有一点关系"><span>有一点，但还比较模糊</span></label>
          <label class="optline"><input type="radio" name="s3" value="说不好"><span>说不好</span></label>
          <label class="optline"><input type="radio" name="s3" value="没什么关系"><span>没什么关系，那是历史了</span></label>
        </fieldset>

        <fieldset>
          <legend class="hand">4. 用一两句话，写下你理解的长征</legend>
          <textarea id="s4" maxlength="200" placeholder="比如：长征不是一段被讲完的故事，而是一群人在不知道终点的情况下，仍然选择往前走。"></textarea>
          <p class="hint"><span id="cc">0</span> / 200 字</p>
        </fieldset>

        <fieldset>
          <legend class="hand">5. 如果让你把长征讲给更多人听，你会选</legend>
          <label class="optline"><input type="radio" name="s5" value="写程序、做小游戏"><span>写程序、做小游戏</span></label>
          <label class="optline"><input type="radio" name="s5" value="画画、做设计"><span>画画、做设计</span></label>
          <label class="optline"><input type="radio" name="s5" value="写文章、拍视频"><span>写文章、拍视频</span></label>
          <label class="optline"><input type="radio" name="s5" value="当面讲给身边的人"><span>当面讲给身边的人</span></label>
        </fieldset>

        <button class="btn" type="submit">提 交</button>
        <p class="hint" id="formTip"></p>
      </form>
    </div>
  </section>

  <!-- 完成 -->
  <section id="done" class="screen">
    <div class="card">
      <p class="lead hand">收到了，谢谢。</p>
      <p class="tnum" id="doneNum"></p>
      <div class="bars" id="bars"></div>
      <div class="acts">
        <button class="btn ghost" id="btnCopyOne">复 制 我 的 答 卷</button>
        <button class="btn ghost" id="btnCopyAll">复 制 全 部</button>
        <button class="btn ghost" id="btnCSV">导 出 表 格</button>
        <button class="btn" id="btnRestart">再 填 一 份</button>
      </div>
      <p class="hint" id="copyTip"></p>
    </div>
  </section>
</div>

<script>
/* ---------- 小工具 ---------- */
/* ---------- 题目 ---------- */
const QS = [
  { q: '1934 年 10 月，中央红军主力从哪个省出发，开始长征？',
    o: ['江西', '福建', '湖南', '贵州'], a: 0,
    why: '1934 年 10 月中旬，中央红军主力从江西于都河出发，踏上长征路。出发时八万六千人，到达陕北时不足八千人。' },

  { q: '标志长征胜利结束的事件是？',
    o: ['遵义会议召开', '三大主力在会宁、将台堡会师', '中央红军到达吴起镇', '飞夺泸定桥'], a: 1,
    why: '1936 年 10 月，红一、红二、红四方面军在甘肃会宁、静宁将台堡会师，长征宣告胜利结束。中央红军到吴起镇是 1935 年 10 月，那只是其中一支。' },

  { q: '1935 年 1 月的遵义会议，主要解决了什么问题？',
    o: ['确定北上抗日的方针', '军事上和组织上的“左”倾错误，确立毛泽东的领导地位', '决定与红四方面军会师', '通过《八一宣言》'], a: 1,
    why: '遵义会议集中解决当时最紧迫的军事和组织问题，实际上确立了毛泽东在党和红军中的领导地位，是党的历史上一个生死攸关的转折点。' },

  { q: '四渡赤水后来被毛泽东称为自己一生的？',
    o: ['得意之笔', '最艰难的一仗', '最大的遗憾', '第二次长征'], a: 0,
    why: '1935 年 1 月至 3 月，红军在川黔滇边界四次渡过赤水河，把几十万敌军拖得团团转。毛泽东后来称这是自己一生的“得意之笔”。' },

  { q: '飞夺泸定桥时，攀着铁索冲过去的突击队有多少人？',
    o: ['12 人', '18 人', '22 人', '30 人'], a: 2,
    why: '1935 年 5 月 29 日，22 名突击队员冒着弹雨攀着 13 根铁索夺下泸定桥，为大部队打开了北上的通道。' },

  { q: '中央红军长征中翻越的第一座大雪山是？',
    o: ['夹金山', '党岭山', '岷山', '六盘山'], a: 0,
    why: '1935 年 6 月，中央红军翻越海拔 4000 多米的夹金山，这是长征中翻越的第一座大雪山。此后还有梦笔山、党岭山等数座。' },

  { q: '红军长征中走过的草地，主要是今天的？',
    o: ['松潘草地', '甘南草原', '呼伦贝尔草原', '巴音布鲁克草原'], a: 0,
    why: '1935 年 8 月，红军进入川西北松潘草地。这里遍布沼泽，一脚踩空就可能陷下去，是长征中减员最严重的路段之一。' },

  { q: '“半条被子”的故事发生在哪里？',
    o: ['湖南汝城', '江西于都', '贵州遵义', '陕西延安'], a: 0,
    why: '1934 年 11 月，三名女红军借宿湖南汝城县沙洲村徐解秀家，临走时把仅有的一床被子剪下一半留给她。徐解秀说：什么是共产党？共产党就是自己有一条被子，也要剪半条给老百姓的人。' },

  { q: '红 34 师师长陈树湘被俘后，做了什么？',
    o: ['断肠明志，壮烈牺牲', '被营救脱险', '隐居乡间', '继续率部突围'], a: 0,
    why: '湘江战役中，陈树湘率红 34 师担任后卫，全师几乎打光。他腹部中弹被俘，在担架上扯断自己的肠子，壮烈牺牲，年仅 29 岁。' },

  { q: '《丰碑》里冻死在雪山上的军需处长，把棉衣让给了谁？',
    o: ['战士', '首长', '老乡', '自己留着'], a: 0,
    why: '行军途中，军需处长把棉衣一件件发给战士，自己只穿单衣，最后冻死在雪山上。队伍经过时，他像一座晶莹的丰碑。' },

  { q: '1930 年底龙冈大捷缴获的“半部电台”，让红军开始有了自己的无线电通信。它的代表人物是？',
    o: ['王诤', '李克农', '钱壮飞', '胡底'], a: 0,
    why: '那部缴获的收报机只能收、不能发，所以叫“半部电台”。王诤用它抄收新闻和敌情，后来建起红军无线电队。长征路上，军委三局靠电报指挥千军万马。' },

  { q: '1935 年 5 月，刘伯承与彝族首领小叶丹在冕宁做了什么？',
    o: ['彝海结盟', '强渡大渡河', '攻占娄山关', '召开政治局会议'], a: 0,
    why: '刘伯承在彝海边与小叶丹歃血为盟，红军顺利通过彝区，为抢渡大渡河赢得了时间。这是党的民族政策一次成功的实践。' }
];

/* ---------- 状态 ---------- */
let idx = 0, picked = [], locked = false, score = 0;
const $ = (id) => document.getElementById(id);
const SKEY = 'cz_survey_v1';

function show(name) {
  document.querySelectorAll('.screen').forEach((s) => s.classList.toggle('on', s.id === name));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ---------- 答题 ---------- */
function renderQ() {
  const cur = QS[idx];
  locked = false;
  $('dots').innerHTML = QS.map((_, i) => {
    const cls = i < idx ? (picked[i] === QS[i].a ? 'done right' : 'done') : (i === idx ? 'now' : '');
    return '<i class="' + cls + '"></i>';
  }).join('');
  $('cnt').textContent = (idx + 1) + ' / ' + QS.length;
  $('qno').textContent = '第 ' + ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十', '十一', '十二'][idx] + ' 题';
  $('ghost').textContent = String(idx + 1).padStart(2, '0');
  $('qtext').textContent = cur.q;
  $('opts').innerHTML = cur.o.map((t, i) =>
    '<button class="opt" data-i="' + i + '"><span class="k">' + 'ABCD'[i] + '</span><span>' + t + '</span></button>'
  ).join('');
  $('opts').querySelectorAll('.opt').forEach((b) => b.addEventListener('click', () => pick(+b.dataset.i)));
  $('fb').hidden = true;
  $('btnNext').hidden = true;
}

function pick(i) {
  if (locked) return;
  locked = true;
  const cur = QS[idx], right = i === cur.a;
  picked[idx] = i;
  if (right) score++;
  $('opts').querySelectorAll('.opt').forEach((b, k) => {
    b.classList.add('locked');
    if (k === cur.a) b.classList.add('right');
    else if (k === i) b.classList.add('wrong');
  });
  const fb = $('fb');
  fb.innerHTML = '<span class="tag">' + (right ? '✓ 答对了' : '✗ 答案是 ' + 'ABCD'[cur.a]) + '</span>' + cur.why;
  fb.hidden = false;
  const nx = $('btnNext');
  nx.hidden = false;
  nx.textContent = idx === QS.length - 1 ? '看 成 绩' : '下 一 题';
}

function next() {
  if (idx === QS.length - 1) { finish(); return; }
  idx++;
  renderQ();
}

function finish() {
  const total = QS.length;
  const r = score;
  $('score').innerHTML = r + '<small> / ' + total + '</small>';
  let rank, desc;
  if (r === total) { rank = '长征史通'; desc = '这个分数，够给同学讲一节课了。'; }
  else if (r >= 10) { rank = '行军参谋'; desc = '细节记得很牢，只差一点火候。'; }
  else if (r >= 8) { rank = '红军战士'; desc = '主干都清楚，回去补补那些人和那些地名。'; }
  else if (r >= 6) { rank = '新兵'; desc = '知道个大概，值得再走一遍。'; }
  else { rank = '刚入伍'; desc = '不丢人——九十年前，出发的人大多也不知道路有多长。'; }
  $('rank').textContent = rank;
  $('rankdesc').textContent = desc;
  show('result');
}

/* ---------- 问卷 ---------- */
let MEM = [];
const STORAGE_OK = (() => {
  try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); return true; }
  catch (e) { return false; }
})();
function loadAll() {
  if (!STORAGE_OK) return MEM;
  try { return JSON.parse(localStorage.getItem(SKEY) || '[]'); } catch (e) { return MEM; }
}
function saveAll(arr) {
  MEM = arr;
  if (!STORAGE_OK) return;
  try { localStorage.setItem(SKEY, JSON.stringify(arr)); } catch (e) {}
}
const pad = (n) => (n < 10 ? '0' + n : '' + n);
function stamp(t) {
  const d = new Date(t);
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function submitSurvey(ev) {
  ev.preventDefault();
  const tip = $('formTip');
  const s1 = (document.querySelector('input[name=s1]:checked') || {}).value;
  const s2 = [...document.querySelectorAll('input[name=s2]:checked')].map((x) => x.value);
  const s3 = (document.querySelector('input[name=s3]:checked') || {}).value;
  const s4 = $('s4').value.trim();
  const s5 = (document.querySelector('input[name=s5]:checked') || {}).value;

  if (!s1) { tip.textContent = '第 1 题还没选。'; return; }
  if (!s3) { tip.textContent = '第 3 题还没选。'; return; }
  if (s4.length < 6) { tip.textContent = '第 4 题至少写一句完整的话（6 个字以上）。'; return; }

  const rec = { t: Date.now(), s1, s2, s3, s4, s5, score: score, total: QS.length };
  const all = loadAll();
  all.push(rec);
  saveAll(all);

  $('doneNum').textContent = '这是这台设备上收到的第 ' + all.length + ' 份答卷。';
  $('bars').innerHTML = barBlock('了解程度', countBy(all, (r) => r.s1)) +
                        barBlock('长征精神和你', countBy(all, (r) => r.s3));
  $('copyTip').textContent = STORAGE_OK ? '' : '提示：当前是直接双击打开的文件，浏览器不让写入本地存储，刷新会丢数据。想把大家填的都存下来，见文件夹里的「怎么用.txt」。';
  $('done').dataset.last = String(all.length - 1);
  show('done');
}

function countBy(arr, fn) {
  const m = {};
  arr.forEach((r) => { const k = fn(r) || '未填'; m[k] = (m[k] || 0) + 1; });
  return m;
}
function barBlock(title, map) {
  const total = Object.values(map).reduce((a, b) => a + b, 0) || 1;
  const rows = Object.entries(map).sort((a, b) => b[1] - a[1]).map(([k, v]) =>
    '<div class="row"><div class="lb"><span>' + k + '</span><span>' + v + ' 人</span></div>' +
    '<div class="track"><div class="fill" style="width:' + Math.round(v / total * 100) + '%"></div></div></div>'
  ).join('');
  return '<div class="row" style="color:var(--red);letter-spacing:1px">' + title + '</div>' + rows;
}

function oneText(r, i) {
  return '【第 ' + (i + 1) + ' 份】' + stamp(r.t) + '　得分 ' + r.score + '/' + r.total + '\n' +
    '了解程度：' + (r.s1 || '') + '\n' +
    '最打动：' + ((r.s2 && r.s2.length) ? r.s2.join('、') : '未选') + '\n' +
    '与生活/专业：' + (r.s3 || '') + '\n' +
    '我理解的长征：' + r.s4 + '\n' +
    '传播方式：' + (r.s5 || '未选');
}

async function copyText(txt) {
  try {
    await navigator.clipboard.writeText(txt);
    return true;
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (_) {}
    ta.remove();
    return ok;
  }
}

function toCSV(all) {
  const esc = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const head = ['时间', '得分', '了解程度', '最打动', '与生活专业', '一句话理解', '传播方式'];
  const body = all.map((r) => [stamp(r.t), r.score + '/' + r.total, r.s1, (r.s2 || []).join('、'), r.s3, r.s4, r.s5].map(esc).join(','));
  return '\ufeff' + head.join(',') + '\n' + body.join('\n');
}

/* ---------- 事件 ---------- */
$('btnStart').addEventListener('click', () => { idx = 0; picked = []; score = 0; show('quiz'); renderQ(); });
$('btnNext').addEventListener('click', next);$('btnSurvey').addEventListener('click', () => show('survey'));
$('sf').addEventListener('submit', submitSurvey);
$('s4').addEventListener('input', () => { $('cc').textContent = $('s4').value.length; });

$('btnCopyOne').addEventListener('click', async () => {
  const all = loadAll();
  const i = +(document.getElementById('done').dataset.last || all.length - 1);
  if (!all[i]) return;
  const ok = await copyText(oneText(all[i], i));
  $('copyTip').textContent = ok ? '已复制到剪贴板，粘贴到微信或文档里就行。' : '复制失败，请手动选中复制。';
});
$('btnCopyAll').addEventListener('click', async () => {
  const all = loadAll();
  if (!all.length) return;
  const ok = await copyText(all.map((r, i) => oneText(r, i)).join('\n\n'));
  $('copyTip').textContent = ok ? '已复制 ' + all.length + ' 份答卷。' : '复制失败，请手动复制。';
});
$('btnCSV').addEventListener('click', () => {
  const all = loadAll();
  if (!all.length) return;
  const blob = new Blob([toCSV(all)], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '长征问卷_' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
});
$('btnRestart').addEventListener('click', () => {
  $('sf').reset(); $('cc').textContent = '0'; $('formTip').textContent = '';
  idx = 0; picked = []; score = 0; show('home');
});

/* ---------- 调试用跳转（不影响正常使用） ---------- */
(function jump() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (!h) return;
  if (h === 'survey') { show('survey'); return; }
  if (h === 'result') {
    picked = QS.map((q, i) => (i % 3 === 0 ? (q.a + 1) % 4 : q.a));
    score = picked.filter((p, i) => p === QS[i].a).length;
    finish(); return;
  }
  const m = h.match(/^q(\d+)$/);
  if (m) {
    idx = Math.min(Math.max(+m[1] - 1, 0), QS.length - 1);
    show('quiz'); renderQ();
  }
})();
</script>

<script>
(function () {
  var lead = document.querySelector('#home .lead');
  if (lead && !lead.dataset.done) {
    var text = lead.textContent;
    lead.textContent = '';
    lead.dataset.done = '1';
    for (var i = 0; i < text.length; i++) {
      var sp = document.createElement('span');
      sp.className = 'ch';
      sp.textContent = text[i];
      sp.style.animationDelay = (i * 55) + 'ms';
      lead.appendChild(sp);
    }
  }
  var wrap = document.querySelector('.wrap');
  if (wrap && !document.querySelector('.morse')) {
    var m = document.createElement('div');
    m.className = 'morse';
    m.setAttribute('aria-hidden', 'true');
    var seq = ['dot','bar','dot','dot','bar','dot','bar','bar','dot'];
    seq.forEach(function (k) {
      var e = document.createElement('i');
      if (k === 'bar') e.className = 'bar';
      m.appendChild(e);
    });
    wrap.appendChild(m);
  }
})();
</script>

<script>
(function () {
  if (!document.querySelector('.poem')) {
    var poem = document.createElement('div');
    poem.className = 'poem';
    poem.setAttribute('aria-hidden', 'true');
    var a = document.createElement('span'); a.textContent = '雄关漫道真如铁';
    var b = document.createElement('span'); b.textContent = '而今迈步从头越';
    poem.appendChild(a); poem.appendChild(b);
    document.body.appendChild(poem);
  }
  var wrap = document.querySelector('.wrap');
  var morse = document.querySelector('.morse');
  if (wrap && morse && !document.querySelector('.colophon')) {
    var c = document.createElement('div');
    c.className = 'colophon';
    c.textContent = '一九三四 — 二〇二六';
    wrap.insertBefore(c, morse);
  }
})();
</script>

<script>
(function () {
  var home = document.getElementById('home');
  var card = home && home.querySelector('.card');
  if (!card || home.querySelector('.timeline')) return;
  var data = [
    ['1934', '出发'],
    ['1935', '遵义'],
    ['1935', '到陕北'],
    ['1936', '会师'],
    ['2026', '九十年']
  ];
  var box = document.createElement('div');
  box.className = 'timeline';
  box.setAttribute('aria-hidden', 'true');
  var ul = document.createElement('ul');
  data.forEach(function (d) {
    var li = document.createElement('li');
    var b = document.createElement('b');
    b.textContent = d[0];
    li.appendChild(b);
    li.appendChild(document.createTextNode(d[1]));
    ul.appendChild(li);
  });
  box.appendChild(ul);
  card.parentNode.insertBefore(box, card.nextSibling);
})();
</script>

<script>
(function () {
  if (document.querySelector('.scenery')) return;
  var edge = document.createElement('div');
  edge.className = 'edge';
  var sc = document.createElement('div');
  sc.className = 'scenery';
  sc.setAttribute('aria-hidden', 'true');
  ['far', 'near'].forEach(function (k) {
    var i = document.createElement('i');
    i.className = k;
    sc.appendChild(i);
  });
  var sun = document.createElement('div');
  sun.className = 'sun';
  sc.appendChild(sun);
  var mist = document.createElement('div');
  mist.className = 'mist';
  sc.appendChild(mist);
  document.body.appendChild(edge);
  document.body.appendChild(sc);
})();
</script>
</body>
</html>
